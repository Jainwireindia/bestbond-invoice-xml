function syncBill() {
  const b = bill(); if (!b || A.tab !== 'build') return;
  const c = ctx(), calc = C.calcBill(b, c), v = validate(b, calc), focus = document.activeElement;
  LASTC = { calc, v };
  calc.lines.forEach((o, i) => {
    const tr = $('#lines tr[data-i="' + i + '"]'); if (!tr) return;
    const ln = b.lines[i], isKg = o.unit === 'KG';
    const el = (f) => $('[data-f="' + f + '"]', tr);
    const put = (f, val) => { const e = el(f); if (e && e !== focus && e.value !== val) e.value = val; };
    ['kgpc', 'std', 'kg'].forEach((f) => { el(f).disabled = !isKg; });
    put('text', ln.text); put('qty', ln.qty); put('rate', ln.rate); put('desc', ln.desc);
    put('kgpc', isKg ? ln.kgpc : '');
    put('std', isKg ? (ln.stdOvr ? ln.std : (o.stdC > 0 ? fmtKg(o.stdC) : '')) : '');
    put('kg', isKg ? (o.manual ? ln.kg : (o.stdC > 0 ? fmtKg(o.finalC) : '')) : '');
    tr.classList.toggle('manual', !!o.manual); tr.classList.toggle('blank', !!o.blank);
    tr.classList.toggle('bad', !o.blank && o.status.some((s) => ['item', 'qty', 'weight', 'rate'].includes(s)));
    $('.lock', tr).hidden = !o.manual;
    $('[data-o="descrow"]', tr).hidden = !(o.item && !isKg);
    $('[data-o="delta"]', tr).textContent = isKg && o.deltaC ? (o.deltaC < 0 ? '−' : '+') + fmtKg(Math.abs(o.deltaC)) : '';
    $('[data-o="amount"]', tr).textContent = o.blank || !o.amountP ? '' : C.inr(o.amountP);
    let sub = '';
    if (o.item) sub = '<span class="ok">✓</span> ' + esc(o.item.name) + (isKg ? '' : ' · ' + esc(o.unit));
    else if (ln.text.trim()) {
      const r = C.resolveItem(ln.text, c.items);
      sub = r.status === 'multi' ? '<span class="badtxt">Matches ' + r.candidates.length + ' items</span> · <a href="#" data-act="fixitem">choose</a>' : '<span class="badtxt">Not in the item master</span> · <a href="#" data-act="fixitem">fix in master</a>';
    }
    $('[data-o="sub"]', tr).innerHTML = sub;
    let rs = '';
    if (isKg && o.tier >= 0 && !o.blank) rs += '<span class="tier ' + (TIER_CLASS[o.tier] || 't4') + '" title="Rate tier on this bill: B is the lowest rate and is cut first">' + esc(o.tierLabel) + '</span>';
    const sv = savedRate(b, o.item);
    if (sv && isFinite(C.num(ln.rate)) && C.num(sv) !== C.num(ln.rate)) rs += ' <span class="hint">saved ' + esc(sv) + '</span>';
    $('[data-o="rsub"]', tr).innerHTML = rs;
  });
  renderBillsBar(); renderPartyInfo(b, calc); renderSummary(calc, v);
}
function renderPartyInfo(b, calc) {

  if (P) {
    h += '<span class="chip">' + esc(P.gstin || 'no GSTIN') + '</span>';
    h += '<span class="chip">' + esc(P.state || C.stateFromGstin(P.gstin) || 'no state') + '</span>';

}
function renderSummary(calc, v) {

function renderBillsBar() {

// ---------- item / party matching for lines ----------
function resolveLine(i) {
  const b = bill(), ln = b.lines[i], r = C.resolveItem(ln.text, ctx().items);
  if (r.status === 'ok') {
    const it = r.item; ln.itemId = it.id;
    if (it.unit === 'KG' && !ln.stdOvr && (ln.kgpc === '' || ln.kgpcAuto)) { ln.kgpc = it.kgpc || ''; ln.kgpcAuto = !!it.kgpc; }
    if (ln.rate === '' || ln.rateAuto) { const sv = savedRate(b, it); if (sv !== '') { ln.rate = sv; ln.rateAuto = true; } }
  } else ln.itemId = '';
}
function setParty(text) {
  const b = bill(), r = C.resolveParty(text, ctx().parties);
  if (r.status === 'ok') { b.partyId = r.party.id; b.partyText = r.party.name; } else { b.partyId = ''; b.partyText = text; }
  b.lines.forEach((ln) => { if (ln.itemId && (ln.rateAuto || ln.rate === '')) { const sv = savedRate(b, ctx().itemsById[ln.itemId]); ln.rate = sv; ln.rateAuto = sv !== ''; } });
}

// ---------- events ----------
function bindBuild() {
  const main = $('#main');
  main.addEventListener('input', (e) => {
    if (A.tab !== 'build') return;
    const t = e.target, b = bill();
    if (t.dataset.b) { b[t.dataset.b] = t.value; if (t.dataset.b === 'vno') b.vnoAuto = false; if (t.dataset.b === 'target') { touchBill(); syncBill(); } return; }
    if (t.dataset.f) {
      const tr = t.closest('tr'), i = +tr.dataset.i, ln = b.lines[i], f = t.dataset.f;
      if (f === 'kg') return;                                    // committed on change
      ln[f] = t.value;
      if (f === 'qty' || f === 'kgpc') { ln.stdOvr = false; ln.std = ''; if (f === 'kgpc') ln.kgpcAuto = false; }
      if (f === 'std') { ln.stdOvr = t.value.trim() !== ''; }
      if (f === 'rate') ln.rateAuto = false;
      if (f === 'text') return;                                  // resolved on change
      touchBill(); syncBill();
    }
  });
  main.addEventListener('change', (e) => {
    if (A.tab !== 'build') return;
    const t = e.target, b = bill();
    if (t.dataset.b) {
      const k = t.dataset.b;
      if (k === 'date') { const d = C.parseDate(t.value); if (d) { b.date = C.fmtDate(d); t.value = b.date; if (b.vnoAuto) { b.vno = nextVno(b.date, b.id); const vi = $('[data-b="vno"]'); if (vi) vi.value = b.vno; } } else b.date = t.value; }
      else if (k === 'partyText') { setParty(t.value); t.value = b.partyText; }
      else if (k === 'locId') { const l = SET().locations.find((x) => x.id === t.value); b.locId = t.value; if (l && b.godownAuto && l.godown) { b.godown = l.godown; const g = $('[data-b="godown"]'); if (g) g.value = b.godown; } }
      else if (k === 'godown') { b.godown = t.value; b.godownAuto = false; }
      else if (k === 'vehicle') { b.vehicle = C.normVehicle(t.value); t.value = b.vehicle; }
      else if (k === 'target') { b.target = t.value.trim(); }
      touchBill(); syncBill(); return;
    }
    if (t.dataset.f) {
      const tr = t.closest('tr'), i = +tr.dataset.i, ln = b.lines[i], f = t.dataset.f;
      if (f === 'text') { ln.text = t.value; resolveLine(i); }
      else if (f === 'kg') {
        const v = t.value.trim();
        if (v === '') ln.kg = ''; else if (isFinite(C.num(v))) ln.kg = String(C.num(v)); else { toast('Billed KG must be a number.', 'err'); }
      }
      touchBill(); syncBill();
    }
  });
  main.addEventListener('keydown', (e) => {
    if (A.tab !== 'build' || e.key !== 'Enter') return;
    const t = e.target; if (!t.dataset || !t.dataset.f) return;
    if (t.dataset.f === 'kg') { t.blur(); return; }
    const tr = t.closest('tr'), b = bill(), i = +tr.dataset.i;
    if (t.dataset.f === 'rate' && i === b.lines.length - 1) { e.preventDefault(); t.blur(); addLine(true); }
  });
  main.addEventListener('click', (e) => {
    const tabLink = e.target.closest('[data-tab]'); if (tabLink) { e.preventDefault(); setTab(tabLink.dataset.tab); return; }
    const a = e.target.closest('[data-act]'); if (!a || A.tab !== 'build') return;
    e.preventDefault();
    const act = a.dataset.act, b = bill(), tr = a.closest('tr'), i = tr ? +tr.dataset.i : +a.dataset.i;
    if (act === 'newbill') { A.bills.push(newBill()); A.cur = A.bills.length - 1; saveBills(); renderBuild(); }
    else if (act === 'pick') { A.cur = i; saveBills(); renderBuild(); }
    else if (act === 'delbill') removeBill(i);
    else if (act === 'addline') addLine(true);
    else if (act === 'delline') { b.lines.splice(i, 1); if (!b.lines.length) b.lines.push(blankLine()); touchBill(); renderBuild(); }
    else if (act === 'unlock') { b.lines[i].kg = ''; touchBill(); syncBill(); }
    else if (act === 'clearlines') { b.lines = [blankLine(), blankLine(), blankLine()]; b.target = ''; touchBill(); renderBuild(); }
    else if (act === 'paste') openPasteDialog();
    else if (act === 'xlsxbill') importBillExcel();
    else if (act === 'fixitem') fixItemDialog(i);
    else if (act === 'fixparty') fixPartyDialog();
    else if (act === 'editparty') { const p = ctx().partiesById[b.partyId]; if (p) openPartyForm(p, null, () => renderBuild()); }
    else if (act === 'export') exportBills([b]);
    else if (act === 'exportall') exportBills(A.bills.filter((x) => !x.exported && validate(x, C.calcBill(x, ctx())).E.length === 0));
  });
}
function addLine(focus) {
  const b = bill(); b.lines.push(blankLine()); saveBills(); renderBuild();
  if (focus) { const rows = $$('#lines tr'); const last = rows[rows.length - 1]; if (last) $('[data-f="text"]', last).focus(); }
}
async function removeBill(i) {
  const x = A.bills[i], has = x.lines.some((l) => l.text || l.qty);
  if (has && !x.exported && !(await confirmBox('Remove ' + (C.tallyNumbers(SET()) ? '' : 'bill ') + billLabel(x) + '? It has not been exported.', 'Remove', true))) return;
  A.bills.splice(i, 1); if (!A.bills.length) A.bills.push(newBill()); A.cur = Math.min(A.cur, A.bills.length - 1); saveBills(); renderBuild();
}

// ---------- paste / Excel -> bill ----------
function openPasteDialog(prefill) {
  modal({
    title: 'Paste from sheet', wide: true,
    html: '<p>Copy the rows from Excel or Google Sheets and paste them here. Columns in order: <b>Item · Pcs · Kg per pc · Total kg · Rate</b>. A first row with the party and date (for example “Mahavir trade links 23.10.26”) is read too. A number alone on a row after the items is taken as the dispatch weight.</p>' +
      '<textarea id="pstx" rows="9" spellcheck="false" placeholder="Paste here"></textarea><div id="pstprev" class="prev"></div>',
    buttons: [{ label: 'Cancel', value: null }, { label: 'Use these rows', kind: 'primary', id: 'pstok', onClick: (close, root) => { const r = BBTools.parseSheet($('#pstx', root).value); if (!r.lines.length) { toast('No item rows found.', 'err'); return; } close(); applySheet(r); } }],
    onOpen: (root) => {
      const ta = $('#pstx', root), pv = $('#pstprev', root);
      const show = () => {
        const r = BBTools.parseSheet(ta.value); if (!ta.value.trim()) { pv.innerHTML = ''; return; }
        const pr = r.partyText ? C.resolveParty(r.partyText, ctx().parties) : { status: 'blank' };
        pv.innerHTML = '<p class="sub">Party: <b>' + esc(r.partyText || '—') + '</b> ' + (pr.status === 'ok' ? '<span class="ok">✓ found</span>' : r.partyText ? '<span class="badtxt">not found</span>' : '') + ' · Date: <b>' + esc(r.date || '—') + '</b> · Dispatch weight: <b>' + esc(r.target || '—') + '</b> · Basic rate: <b>' + esc(r.baseRate || '—') + '</b></p>' +
          '<table class="mini"><thead><tr><th>Item</th><th>Matches</th><th class="r">Pcs</th><th class="r">Kg/pc</th><th class="r">Kg</th><th class="r">Rate</th></tr></thead><tbody>' +
          r.lines.map((l) => { const m = C.resolveItem(l.text, ctx().items); return '<tr><td>' + esc(l.text) + '</td><td>' + (m.status === 'ok' ? '<span class="ok">✓</span> ' + esc(m.item.name) : '<span class="badtxt">no match</span>') + '</td><td class="r">' + esc(l.qty) + '</td><td class="r">' + esc(l.kgpc) + '</td><td class="r">' + esc(l.kg) + '</td><td class="r">' + esc(l.rate) + '</td></tr>'; }).join('') + '</tbody></table>';
      };
      ta.addEventListener('input', show); if (prefill) { ta.value = prefill; show(); }
    },
  });
}
function applySheet(r) {
  let b = bill();
  if (b.lines.some((l) => l.text || l.qty)) { A.bills.push(newBill()); A.cur = A.bills.length - 1; b = bill(); }
  if (r.date) { b.date = r.date; if (b.vnoAuto) b.vno = nextVno(b.date, b.id); }
  if (r.partyText) setParty(r.partyText);
  if (r.target) b.target = String(r.target);
  b.lines = r.lines.map((l) => {
    const ln = blankLine(); ln.text = l.text; ln.qty = l.qty; ln.kgpc = l.kgpc; ln.rate = l.rate || r.baseRate || '';
    const kg = C.num(l.kg), q = C.num(l.qty), k = C.num(l.kgpc);
    if (isFinite(kg) && !(isFinite(q) && isFinite(k) && Math.abs(q * k - kg) < 0.005)) { ln.std = String(kg); ln.stdOvr = true; }
    return ln;
  });
  b.lines.forEach((ln, i) => { const rate = ln.rate, kgpc = ln.kgpc; resolveLine(i); if (rate) { ln.rate = rate; ln.rateAuto = false; } if (kgpc) { ln.kgpc = kgpc; ln.kgpcAuto = false; } });
  saveBills(); renderBuild(); toast('Loaded ' + b.lines.length + ' lines' + (r.target ? ' with dispatch weight ' + r.target : '') + '.');
}
async function importBillExcel() {
  const f = await pickFile('.xlsx,.xls,.csv'); if (!f) return;
  try { openPasteDialog(await sheetToTsv(f)); } catch (e) { toast(e.message, 'err'); }
}

// ---------- export ----------
async function exportBills(list) {
  if (!list.length) return;
  const c = ctx(), vouchers = [], calcs = [];
  for (const b of list) {
    const calc = C.calcBill(b, c), v = validate(b, calc);
    if (v.E.length) { toast((C.tallyNumbers(SET()) ? '' : 'Bill ') + billLabel(b) + ' has problems: ' + v.E[0], 'err'); return; }
    const dup = v.W.find((w) => /already exported/.test(w));
    if (dup && !(await confirmBox(dup + '\n\nExport anyway?', 'Export anyway', true))) return;
    vouchers.push(BBXml.voucher(b, calc, c)); calcs.push(calc);
  }
  const xml = BBXml.envelope(vouchers, c), auto = C.tallyNumbers(SET()), now = Date.now();
  let name;
  if (list.length === 1) name = BBXml.fileName(list[0], calcs[0], SET(), now);
  else if (auto) { const t = new Date(now), p2 = (n) => String(n).padStart(2, '0'); name = 'Sales_' + C.todayDMY() + '_' + list.length + '-bills_' + p2(t.getHours()) + p2(t.getMinutes()) + '.xml'; }
  else { const f = C.vnoParse(list[0].vno), l = C.vnoParse(list[list.length - 1].vno); name = f && l ? 'Sales_' + f.prefix.replace(/\W+/g, '_') + String(f.n).padStart(4, '0') + '-to-' + String(l.n).padStart(4, '0') + '_' + f.fy + '.xml' : 'Sales_BB_batch.xml'; }
  download(name, xml, 'application/xml');
  const S = SET();
  list.forEach((b, k) => {
    const calc = calcs[k], P = calc.party;
    DATA.log.unshift({ id: BBData.newId('x'), ts: now, user: A.user || '', voucher: auto ? '' : b.vno, party: P.name, date: b.date, kg: calc.totals.kgFinal, taxable: calc.totals.taxable, total: calc.totals.grand, file: name });

    if (b.vehicle) { S.vehicles = (S.vehicles || []).filter((v) => v !== b.vehicle).concat(b.vehicle).slice(-30); }
    calc.lines.forEach((o) => { if (!o.blank && o.item && o.rateP > 0) { P.rates = P.rates || {}; P.rates[o.item.id] = C.fixed(o.rateP); } });
    P.u = now;
  });
  S._u = now; saveData(); saveBills(); renderBuild();

}

function bindMasters() {
  const main = $('#main');
  main.addEventListener('input', (e) => {
    if (e.target.id !== 'q' || (A.tab !== 'items' && A.tab !== 'parties')) return;
    A.q[A.tab] = e.target.value; const pos = e.target.selectionStart; (A.tab === 'items' ? renderItems : renderParties)(); const q = $('#q'); q.focus(); q.setSelectionRange(pos, pos);
  });
  const open = (e) => {
    if (A.tab !== 'items' && A.tab !== 'parties') return;
    const tr = e.target.closest('tr[data-id]'); if (!tr) return;
    if (A.tab === 'items') openItemForm(ctx().items.find((i) => i.id === tr.dataset.id)); else openPartyForm(ctx().parties.find((p) => p.id === tr.dataset.id));
  };
  main.addEventListener('click', (e) => {
    if (A.tab !== 'items' && A.tab !== 'parties') return;
    const a = e.target.closest('[data-act]');

      if (act === 'newitem') openItemForm(null); else if (act === 'newparty') openPartyForm(null);

    open(e);
  });
  main.addEventListener('keydown', (e) => { if (e.key === 'Enter' && e.target.matches && e.target.matches('tr[data-id]')) open(e); });
}

    buttons: [{ label: 'Cancel', value: null }, { label: 'Import', kind: 'primary', onClick: (close, root) => {
      const recs = parseImport(isItems, $('#imptx', root).value); if (!recs) { toast('Could not find a “Name” column in the first row.', 'err'); return; }
      const n = applyImport(isItems, recs); close(); toast(n.added + ' added, ' + n.updated + ' updated.'); refreshTab();
    } }],
    onOpen: (root) => {
      const ta = $('#imptx', root), pv = $('#impprev', root);
      const show = () => { if (!ta.value.trim()) { pv.innerHTML = ''; return; } const r = parseImport(isItems, ta.value); pv.innerHTML = r ? '<p class="okline">✓ ' + r.length + ' row(s) found.</p>' : '<p class="errs">No “Name” column found in the first row.</p>'; };
      ta.addEventListener('input', show);
      $('#impfile', root).addEventListener('click', async () => { const f = await pickFile('.xlsx,.xls,.csv'); if (!f) return; try { ta.value = await sheetToTsv(f); show(); } catch (e) { toast(e.message, 'err'); } });
    },
  });
}
function parseImport(isItems, text) { return BBTools.parseTable(BBTools.textToRows(text), isItems ? BBTools.ITEM_COLS : BBTools.PARTY_COLS); }
function applyImport(isItems, recs) {
  const list = isItems ? DATA.items : DATA.parties, now = Date.now(); let added = 0, updated = 0;
  recs.forEach((r) => {
    if (!r.name) return;
    const rec = isItems ? BBTools.toItem(r, SET()) : BBTools.toParty(r);
    const hit = list.find((x) => !x.del && C.norm(x.name) === C.norm(r.name));
    if (hit) { Object.keys(rec).forEach((k) => { if (rec[k] !== '' && rec[k] != null) hit[k] = rec[k]; }); hit.u = now; updated++; }
    else { list.push(Object.assign({ id: BBData.newId(isItems ? 'i' : 'p'), u: now }, rec, isItems ? {} : { rates: {} })); added++; }
  });
  saveData(); return { added, updated };
}

    buttons: [{ label: 'Cancel', value: null }].concat(loc && SET().locations.length > 1 ? [{ label: 'Delete', kind: 'danger', onClick: (close) => { SET().locations = SET().locations.filter((x) => x.id !== l.id); touchSettings(); close(); renderSettings(); } }] : [])
      .concat([{ label: 'Save', kind: 'primary', onClick: (close, root) => {
        const v = formVals(root), err = $('#ferr', root); if (!v.name || !v.addr) return (err.textContent = 'Enter a name and the address.');
        if (loc) Object.assign(SET().locations.find((x) => x.id === l.id), v); else SET().locations.push(Object.assign({ id: BBData.newId('l') }, v));
        touchSettings(); close(); renderSettings();
      } }]),
  });
}
function bindSettings() {
  const main = $('#main');
  main.addEventListener('change', (e) => {
    if (A.tab !== 'settings') return;
    const t = e.target, S = SET();
    if (t.dataset.s) {
      let v = t.value.trim(); const p = t.dataset.s;
      if (['gstDefault', 'adjStep', 'adjMaxPct', 'numbering.width'].includes(p)) { const n = C.num(v); if (!(n > 0)) { toast('Enter a number above zero.', 'err'); t.value = pathGet(S, p); return; } v = n; }
      pathSet(S, p, v);
    } else if (t.dataset.sl) { S.salesLedgers[t.dataset.sl] = t.value.trim(); }
    else if (t.dataset.nx !== undefined) { const n = parseInt(t.value, 10); if (n > 0) S.numbering.next[t.dataset.nx] = n; else delete S.numbering.next[t.dataset.nx]; }
    else if (t.hasAttribute('data-gd')) { S.godowns = t.value.split(/\r?\n/).map((x) => x.trim()).filter(Boolean); }
    else return;
    touchSettings(); toast('Saved');
    if (t.dataset.s === 'numbering.mode') renderSettings();
  });
  main.addEventListener('click', (e) => {
    if (A.tab !== 'settings') return;
    const a = e.target.closest('[data-act]'), tr = e.target.closest('tr[data-loc]');
    if (a && a.dataset.act === 'addsl') {
      const r = C.num($('#slrate').value), n = $('#slname').value.trim(); if (!(r > 0) || !n) { toast('Enter the GST % and the ledger name.', 'err'); return; }
      SET().salesLedgers[String(r)] = n; touchSettings(); renderSettings();
    } else if (a && a.dataset.act === 'newloc') openLocForm(null);
    else if (tr) openLocForm(SET().locations.find((l) => l.id === tr.dataset.loc));
  });
}

/* --- app_cloud.js --- */
/* ===== Cloud & Backup, Export log, login screen ===== */
const cloudUrl = () => (LS.get(KEY.url, '') || CLOUD_URL || '').trim();
const BADGE = { off: ['☁ Off', 'off'], loggedout: ['☁ Not logged in', 'off'], synced: ['☁ Synced', 'ok'], pending: ['☁ Changes waiting…', 'wait'], saving: ['☁ Saving…', 'wait'], offline: ['☁ Offline', 'warn'], choice: ['☁ Needs your choice', 'warn'], error: ['☁ Sync error', 'bad'] };
function updateBadge() {
  const b = $('#cloudBadge'); if (!b) return;
  const [txt, cls] = BADGE[A.sync.status] || BADGE.off; b.textContent = txt; b.className = 'badge ' + cls; b.title = A.sync.msg || 'Open Cloud & Backup';
  const u = $('#userName'); if (u) u.textContent = A.user ? '👤 ' + A.user : '';
}
function onSyncStatus(info) {
  A.sync = info; A.user = info.status === 'loggedout' || info.status === 'off' ? A.user : info.user;
  if (info.status === 'loggedout') A.user = '';
  updateBadge(); if (A.tab === 'cloud') renderCloud();
}
function stamp(ts) { return ts ? C.stamp(ts) : 'never'; }

function renderCloud() {
  const s = A.sync, url = cloudUrl(), st = s.status;
  let top;
  if (!url) top = '<p>No cloud link is set, so this PC works on its own. To share the masters between PCs, set up the Google Sheet and its Apps Script (see the setup guide), then paste its <b>/exec</b> link here.</p><div class="row"><input id="curl" placeholder="https://script.google.com/macros/s/…/exec" aria-label="Cloud link"><button class="btn primary" data-act="saveurl">Save link</button></div>';
  else if (st === 'loggedout' || (!BBSync.loggedIn() && st !== 'offline')) top = '<p>Not logged in. Masters and settings stay on this PC until you log in.</p><div class="actions"><button class="btn primary" data-act="login">Log in</button></div>';
  else top = '<p>Logged in as <b>' + esc(s.user || A.user) + '</b>. Last synced: <b>' + esc(stamp(s.lastSync)) + '</b>.' + (/^https:\/\/docs\.google\.com\//.test(s.sheet || '') ? ' <a href="' + esc(s.sheet) + '" target="_blank" rel="noopener">Open the Google Sheet</a>' : '') + '</p><p class="sub">Items, parties, party rates, settings and the export log are kept in the Google Sheet. Edits made in the Sheet reach every PC within 2 minutes.</p><div class="actions"><button class="btn" data-act="syncnow">Sync now</button><button class="btn" data-act="logout">Log out / change user</button></div>';
  let choice = '';
  if (st === 'choice' && s.pending) choice = '<div class="choice"><b>Two PCs changed the data before syncing.</b><p>The cloud copy was last saved by <b>' + esc(s.pending.by || 'someone') + '</b> on ' + esc(s.pending.updated ? C.stamp(Date.parse(s.pending.updated)) : '') + '. Choose what to keep:</p><div class="actions"><button class="btn primary" data-act="rcombine">Combine both (recommended)</button><button class="btn" data-act="rcloud">Use the cloud copy</button><button class="btn danger" data-act="rmine">Keep this PC\'s copy</button></div><p class="sub">Combine keeps every item and party from both and the newest edit of each. Use the cloud copy discards this PC\'s unsynced edits. Keep this PC\'s copy replaces the cloud.</p></div>';
  if (st === 'error' || st === 'offline') choice += '<p class="errline">' + esc(s.msg) + '</p>';
  if (st === 'loggedout' && s.msg) choice += '<p class="errline">' + esc(s.msg) + '</p>';
  $('#main').innerHTML = '<section class="card"><div class="cardhead"><h2>Cloud sync</h2><span id="cloudBadge2" class="badge ' + (BADGE[st] || BADGE.off)[1] + '">' + esc((BADGE[st] || BADGE.off)[0]) + '</span></div>' + top + choice +
    (url ? '<details class="more"><summary>Cloud link</summary><div class="row"><input id="curl" value="' + esc(url) + '" aria-label="Cloud link"><button class="btn" data-act="saveurl">Change link</button></div></details>' : '') + '</section>' +
    '<section class="card"><h2>Backup</h2><p>A backup holds the item master, party master, settings and export log. Bills being prepared are not included.</p><div class="actions"><button class="btn" data-act="backup">Download backup (JSON)</button><button class="btn" data-act="restore">Restore from backup…</button></div></section>' +
    '<section class="card"><h2>Excel</h2><p>The masters as an editable Excel file (two sheets: Items and Parties). Edit them in Excel and bring them back with <b>Import…</b> on the Item master or Party master tab.</p><div class="actions"><button class="btn" data-act="xlsxout">Download masters as Excel</button></div></section>' +
    '<p class="foot">Best Bond Bill Builder v' + APP_VERSION + (STORAGE_OK ? '' : ' · <span class="badtxt">this browser is blocking storage, so changes are not remembered after closing</span>') + '</p>';
}
function bindCloud() {
  $('#main').addEventListener('click', async (e) => {
    if (A.tab !== 'cloud') return;
    const a = e.target.closest('[data-act]'); if (!a) return; e.preventDefault();
    const act = a.dataset.act;
    if (act === 'saveurl') {
      const v = ($('#curl').value || '').trim();
      if (v && !/^https:\/\/script\.google\.com\/macros\/s\/.+\/exec$/.test(v)) { toast('That does not look like an Apps Script link. It should end with /exec.', 'err'); return; }
      LS.set(KEY.url, v); BBSync.setUrl(cloudUrl()); toast(v ? 'Link saved.' : 'Link cleared.'); if (v) { await BBSync.init(syncHooks()); }
      renderCloud();
    } else if (act === 'login') showLogin('');
    else if (act === 'logout') { BBSync.logout(); toast('Logged out.'); }
    else if (act === 'syncnow') BBSync.syncNow().then(() => toast(A.sync.status === 'synced' ? 'Up to date.' : 'Sync did not finish: see the message.', A.sync.status === 'synced' ? '' : 'err'));
    else if (act === 'rcombine') BBSync.resolve('merge'); else if (act === 'rcloud') BBSync.resolve('cloud');
    else if (act === 'rmine') { if (await confirmBox('Replace the cloud copy with this PC\'s data? Anything only in the cloud is lost.', 'Replace cloud', true)) BBSync.resolve('mine'); }
    else if (act === 'backup') backupDownload();
    else if (act === 'restore') restoreBackup();
    else if (act === 'xlsxout') mastersExcel();
  });
}
function backupDownload() {
  const d = new Date(), p = (n) => String(n).padStart(2, '0');
  download('bestbond-backup-' + d.getFullYear() + p(d.getMonth() + 1) + p(d.getDate()) + '-' + p(d.getHours()) + p(d.getMinutes()) + '.json', JSON.stringify({ app: 'bestbond-bill-builder', kind: 'backup', version: APP_VERSION, exported: d.toISOString(), data: DATA }, null, 1), 'application/json');
  toast('Backup downloaded.');
}
async function restoreBackup() {
  const f = await pickFile('.json,application/json'); if (!f) return;
  let j; try { j = JSON.parse(await fileText(f)); } catch (e) { toast('That file is not a valid backup.', 'err'); return; }
  const d = j && j.data ? j.data : j;
  if (!d || !Array.isArray(d.items) || !Array.isArray(d.parties)) { toast('That file does not look like a Best Bond backup.', 'err'); return; }
  const n = normData(d);
  if (!(await confirmBox('Replace everything on this PC with the backup?\n\n' + n.items.filter((i) => !i.del).length + ' items, ' + n.parties.filter((p) => !p.del).length + ' parties, ' + n.log.length + ' log entries.', 'Restore', true))) return;
  DATA = n; DATA.settings._u = Date.now(); saveData(); toast('Backup restored.'); refreshTab();
}
function mastersExcel() {
  if (!hasXLSX()) { toast('The Excel writer did not load (no internet?). Use the backup file instead.', 'err'); return; }
  const items = ctx().items.map((i) => ({ Name: i.name, Family: famName(i.family), Unit: i.unit, 'Stock Group': i.group, 'Tax Source': i.taxSource, HSN: i.hsn, 'HSN Description': i.hsnDesc, 'GST %': i.gst, 'Kg per pc': i.kgpc, Rate: i.rate, Aliases: i.aliases }));
  const parties = ctx().parties.map((p) => ({ Name: p.name, GSTIN: p.gstin, Address: (p.addr || '').split('\n').join(' | '), Pincode: p.pin, Place: p.place, State: p.state, 'Address Type': p.addrType, Aliases: p.aliases }));
  const X = window.XLSX, wb = X.utils.book_new();
  X.utils.book_append_sheet(wb, X.utils.json_to_sheet(items), 'Items'); X.utils.book_append_sheet(wb, X.utils.json_to_sheet(parties), 'Parties');
  X.writeFile(wb, 'BestBond-masters.xlsx');
}

// ---------- export log ----------
function renderLog() {
  const q = A.q.log.toLowerCase(), rows = DATA.log.filter((l) => !q || (l.voucher + ' ' + l.party + ' ' + l.user + ' ' + l.file).toLowerCase().includes(q));
  $('#main').innerHTML = '<section class="card"><div class="cardhead"><h2>Export log <span class="count">' + DATA.log.length + '</span></h2><div class="actions"><input class="search" id="q" placeholder="Search the log" value="' + esc(A.q.log) + '" aria-label="Search the log"><button class="btn" data-act="logcsv">Download CSV</button></div></div>' +
    '<div class="tablewrap"><table class="grid-t"><thead><tr><th>Exported</th><th>User</th><th>Voucher</th><th>Party</th><th>Bill date</th><th class="r">KG</th><th class="r">Taxable ₹</th><th class="r">Total ₹</th><th>File</th></tr></thead><tbody>' +
    (rows.slice(0, 500).map((l) => '<tr><td>' + esc(C.stamp(l.ts)) + '</td><td>' + esc(l.user || '—') + '</td><td>' + (l.voucher ? esc(l.voucher) : '<span class="muted">by Tally</span>') + '</td><td>' + esc(l.party) + '</td><td>' + esc(l.date) + '</td><td class="r">' + C.kgFmt(l.kg) + '</td><td class="r">' + C.inr(l.taxable) + '</td><td class="r">' + C.inr(l.total) + '</td><td class="muted">' + esc(l.file) + '</td></tr>').join('') || '<tr><td colspan="9" class="empty">Nothing exported yet.</td></tr>') + '</tbody></table></div></section>';
}
function bindLog() {
  const main = $('#main');
  main.addEventListener('input', (e) => { if (A.tab === 'log' && e.target.id === 'q') { A.q.log = e.target.value; const pos = e.target.selectionStart; renderLog(); const q = $('#q'); q.focus(); q.setSelectionRange(pos, pos); } });
  main.addEventListener('click', (e) => {
    if (A.tab !== 'log') return; const a = e.target.closest('[data-act]'); if (!a || a.dataset.act !== 'logcsv') return;
    const q = (s) => '"' + String(s == null ? '' : s).replace(/"/g, '""') + '"';
    const lines = [['Exported', 'User', 'Voucher', 'Party', 'Bill date', 'KG', 'Taxable', 'Total', 'File'].join(',')].concat(DATA.log.map((l) => [C.stamp(l.ts), l.user, l.voucher, l.party, l.date, (l.kg / 100).toFixed(2), C.fixed(l.taxable), C.fixed(l.total), l.file].map(q).join(',')));
    download('bestbond-export-log.csv', lines.join('\r\n'), 'text/csv');
  });
}

// ---------- login screen ----------
function showLogin(reason) {
  const el = $('#login'); el.hidden = false;
  el.innerHTML = '<form class="logincard" id="lform"><h1>Best Bond Bill Builder <span class="ver">v' + APP_VERSION + '</span></h1><p class="sub">Log in to share masters and settings between PCs.</p>' +
    '<label>User name<input name="u" autocomplete="username" required></label><label>Password<input name="p" type="password" autocomplete="current-password" required></label>' +
    '<p class="errline" id="lerr">' + esc(reason || '') + '</p><div class="actions"><button class="btn primary" type="submit">Log in</button><button class="btn ghost" type="button" id="lskip">Continue without logging in</button></div>' +
    '<p class="sub">Without logging in, nothing syncs and the Export log records no user.</p></form>';
  const u = $('[name=u]', el); u.focus();
  $('#lskip', el).addEventListener('click', () => { el.hidden = true; });
  $('#lform', el).addEventListener('submit', async (e) => {
    e.preventDefault(); const f = e.target, btn = $('button[type=submit]', f); btn.disabled = true; $('#lerr', el).textContent = 'Checking…';
    const r = await BBSync.login(f.u.value, f.p.value); btn.disabled = false;
    if (r.ok) { el.hidden = true; toast('Logged in.'); refreshTab(); } else $('#lerr', el).textContent = r.error || 'Login failed.';
  });
}

/* --- app_main.js --- */
/* ===== start-up, tabs, theme, sync hooks ===== */
const TABS = [['build', 'Build bills'], ['items', 'Item master'], ['parties', 'Party master'], ['settings', 'Settings'], ['cloud', 'Cloud & Backup'], ['log', 'Export log']];

function setTab(t) {
  A.tab = t; LS.set('bbbb.tab', t);
  $$('#tabs [data-tab]').forEach((b) => { b.classList.toggle('on', b.dataset.tab === t); b.setAttribute('aria-selected', b.dataset.tab === t ? 'true' : 'false'); });
  refreshTab();
}
function refreshTab() {
  const f = { build: renderBuild, items: renderItems, parties: renderParties, settings: renderSettings, cloud: renderCloud, log: renderLog }[A.tab];
  f(); if (A.tab !== 'build') window.scrollTo(0, 0);
}
function applyTheme(t) {
  const root = document.documentElement; if (t === 'light' || t === 'dark') root.setAttribute('data-theme', t); else root.removeAttribute('data-theme');
  const dark = t === 'dark' || (t !== 'light' && window.matchMedia && window.matchMedia('(prefers-color-scheme: dark)').matches);
  const b = $('#themeBtn'); if (b) { b.textContent = dark ? '☀' : '☾'; b.title = dark ? 'Switch to light theme' : 'Switch to dark theme'; b.setAttribute('aria-label', b.title); }
}
function syncHooks() {
  return {
    fetch: (u, o) => window.fetch(u, o), url: cloudUrl,
    loadMeta: () => LS.get(KEY.meta, null), saveMeta: (m) => LS.set(KEY.meta, m),
    loadAuth: () => LS.get(KEY.auth, null), saveAuth: (a) => (a ? LS.set(KEY.auth, a) : LS.del(KEY.auth)),
    getData: () => clone({ items: DATA.items, parties: DATA.parties, settings: DATA.settings, log: DATA.log }),
    setData: (d) => { DATA = normData(clone(d)); persist(); if (A.tab === 'build') { refreshLists(); syncBill(); } else refreshTab(); },
    isEmpty: BBData.isEmpty, same: (a, b) => BBData.same(normData(clone(a)), normData(clone(b))), merge: (l, c) => normData(BBData.merge(l, c)),
    onStatus: onSyncStatus, onLoginRefused: (reason) => { const el = $('#login'); if (el && el.hidden) showLogin(reason); },
  };
}

function boot() {
  DATA = loadData(); loadBills();
  document.title = 'Best Bond Bill Builder';
  $('#app').innerHTML =
    '<header class="top"><div class="brand"><span class="logo" aria-hidden="true">BB</span><h1>Best Bond Bill Builder</h1><span class="ver" id="verBadge" title="Tool version">v' + APP_VERSION + '</span></div>' +
    '<div class="right"><span id="userName" class="user"></span><button id="cloudBadge" class="badge off" data-tab="cloud">☁ Off</button><button id="themeBtn" class="icon theme" aria-label="Switch theme"></button></div></header>' +
    '<nav id="tabs" class="tabs" role="tablist">' + TABS.map(([k, l]) => '<button role="tab" data-tab="' + k + '" aria-selected="false">' + esc(l) + '</button>').join('') + '</nav><main id="main"></main>';
  applyTheme(LS.get(KEY.theme, ''));
  $('#themeBtn').addEventListener('click', () => { const cur = document.documentElement.getAttribute('data-theme'); const dark = cur === 'dark' || (!cur && window.matchMedia && window.matchMedia('(prefers-color-scheme: dark)').matches); const nxt = dark ? 'light' : 'dark'; LS.set(KEY.theme, nxt); applyTheme(nxt); });
  $('#tabs').addEventListener('click', (e) => { const b = e.target.closest('[data-tab]'); if (b) setTab(b.dataset.tab); });
  $('#cloudBadge').addEventListener('click', () => setTab('cloud'));
  bindBuild(); bindMasters(); bindSettings(); bindCloud(); bindLog();
  const t = LS.get('bbbb.tab', 'build'); A.tab = TABS.some((x) => x[0] === t) ? t : 'build';
  setTab(A.tab);
  window.addEventListener('beforeunload', () => { try { LS.set(KEY.bills, { bills: A.bills, cur: A.cur }); } catch (e) { /* ignore */ } });
  window.addEventListener('online', () => BBSync.syncNow());
  const hooks = syncHooks();
  BBSync.init(hooks).then(() => { if (BBSync.info().status === 'loggedout' && cloudUrl()) showLogin(BBSync.info().msg); });
  if (cloudUrl() && !LS.get(KEY.auth, null)) showLogin('');
}
document.addEventListener('DOMContentLoaded', boot);

</script>
